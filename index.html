  if (!Q.has('noblob')) BLOB.update(); ADPR.step(t);
  renderer.info.reset(); composer.render(); PERF.frame(t);
  requestAnimationFrame(tick);
}

document.fonts.ready.then(() => { boardKey = ''; plates.forEach(r => r()); drawCover(); coverTex.needsUpdate = true; if (FIN){ FIN.drawAtlas(); FIN.atlasTex.needsUpdate = true; } });
